name: ADS contracts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime and onboarding
        run: python -m compileall -q runtime onboarding tests
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Validate example contract
        run: python3 onboarding/validate_project.py examples/repository --run-verification
